<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代码状态与统计 - CodeStatus</title>
    <link rel="stylesheet" href="codestatus.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>📊 代码仓库状态与统计</h1>
            <p id="target-dir" class="target-dir">正在加载目标目录...</p>
        </header>

        <!-- 概览卡片区 -->
        <div class="stats-cards">
            <div class="card">
                <h3>总文件数</h3>
                <p id="stat-files" class="stat-value">-</p>
            </div>
            <div class="card">
                <h3>总代码行数</h3>
                <p id="stat-lines" class="stat-value">-</p>
            </div>
            <div class="card">
                <h3>总字符数</h3>
                <p id="stat-chars" class="stat-value">-</p>
            </div>
        </div>

        <!-- 语言统计与文件列表区 -->
        <div class="content-grid">
            <div class="panel">
                <h2>📈 各语言统计</h2>
                <div class="table-container">
                    <table id="lang-table">
                        <thead>
                            <tr>
                                <th>语言</th>
                                <th>文件数</th>
                                <th>行数</th>
                                <th>字符数</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- 动态填充 -->
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="panel">
                <h2>📁 文件详情列表</h2>
                <div class="filter-controls" style="display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap;">
                    <div class="search-box" style="flex: 1; min-width: 200px; margin-bottom: 0;">
                        <input type="text" id="search-input" placeholder="搜索文件名或路径..." style="width: 100%; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-card); color: var(--text-main);">
                    </div>
                    <div class="filter-box" style="min-width: 150px;">
                        <select id="lang-filter" style="width: 100%; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-card); color: var(--text-main);">
                            <option value="">所有语言/类型</option>
                        </select>
                    </div>
                </div>
                <div class="table-container file-list-container">
                    <table id="file-table">
                        <thead>
                            <tr>
                                <th class="sortable" data-sort="path" style="cursor: pointer;">文件路径 ↕</th>
                                <th class="sortable" data-sort="language" style="cursor: pointer;">语言 ↕</th>
                                <th class="sortable" data-sort="lines" style="cursor: pointer;">行数 ↕</th>
                                <th class="sortable" data-sort="chars" style="cursor: pointer;">字符数 ↕</th>
                                <th class="sortable" data-sort="size" style="cursor: pointer;">大小 ↕</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- 动态填充 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="codestatus.js"></script>
</body>
</html>
