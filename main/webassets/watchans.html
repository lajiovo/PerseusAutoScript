<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>WatchAns 管理控制台 (Perseus AST)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; background: #f0f2f5; color: #333; }
        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
        h2 { margin-top: 0; font-size: 1.2rem; border-bottom: 2px solid #007bff; padding-bottom: 8px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 0.9rem; }
        input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 0.9rem; }
        textarea { height: 120px; resize: vertical; font-family: monospace; }
        button { background: #007bff; color: white; border: none; padding: 10px 16px; border-radius: 4px; cursor: pointer; font-weight: 600; }
        button:hover { background: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
        th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; }
        th { background: #f8f9fa; }
        .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .badge.synced { background: #d4edda; color: #155724; }
        .badge.pending { background: #fff3cd; color: #856404; }
        .full-width { grid-column: span 2; }
        .log-box { background: #1e1e1e; color: #dcdcdc; padding: 10px; border-radius: 4px; font-family: monospace; height: 180px; overflow-y: auto; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 左侧：输入与上传 -->
        <div>
            <div class="card">
                <h2>📥 新增题目 / 解析文本 (AST)</h2>
                <div class="form-group">
                    <label>题目名称</label>
                    <input type="text" id="titleInput" placeholder="例如：二次函数极值求解">
                </div>
                <div class="form-group">
                    <label>题目分类</label>
                    <select id="categorySelect">
                        <option value="数学">数学</option>
                        <option value="物理">物理</option>
                        <option value="化学">化学</option>
                        <option value="综合">综合</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Markdown / LaTeX 原始文本</label>
                    <textarea id="rawTextInput" placeholder="支持 \frac{a}{b}, \sqrt{x}, \ce{H2O}, 等..."></textarea>
                </div>
                <button onclick="uploadAns()">处理并同步到手表</button>
            </div>

            <div class="card">
                <h2>📡 最近手表 API 请求日志</h2>
                <button onclick="loadLogs()" style="margin-bottom: 10px; padding: 4px 8px; font-size: 0.8rem;">刷新日志</button>
                <div class="log-box" id="logBox">暂无日志...</div>
            </div>
        </div>

        <!-- 右侧：列表与同步状态 -->
        <div>
            <div class="card">
                <h2>📋 题目列表与同步状态</h2>
                <button onclick="loadStatus()" style="margin-bottom: 10px; padding: 4px 8px; font-size: 0.8rem;">刷新列表</button>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>标题</th>
                            <th>分类</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="statusTableBody">
                        <!-- 动态加载 -->
                    </tbody>
                </table>
            </div>

            <div class="card">
                <h2>⚡ 当前同步队列 (Tasks)</h2>
                <button onclick="loadTasks()" style="margin-bottom: 10px; padding: 4px 8px; font-size: 0.8rem;">刷新队列</button>
                <table>
                    <thead>
                        <tr>
                            <th>Task ID</th>
                            <th>Ans ID</th>
                            <th>标题</th>
                            <th>分类</th>
                        </tr>
                    </thead>
                    <tbody id="taskTableBody">
                        <!-- 动态加载 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/watch/pans';

        async function uploadAns() {
            const title = document.getElementById('titleInput').value;
            const category = document.getElementById('categorySelect').value;
            const raw_text = document.getElementById('rawTextInput').value;

            if (!raw_text) {
                alert('请输入原始文本');
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/upload`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, category, raw_text })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    alert('处理成功并已加入同步队列！ID: ' + data.ans_id);
                    document.getElementById('rawTextInput').value = '';
                    loadStatus();
                    loadTasks();
                    loadLogs();
                } else {
                    alert('处理失败: ' + data.message);
                }
            } catch (e) {
                alert('请求异常: ' + e);
            }
        }

        async function loadStatus() {
            try {
                const res = await fetch(`${API_BASE}/sync_status`);
                const data = await res.json();
                if (data.status === 'success') {
                    const tbody = document.getElementById('statusTableBody');
                    tbody.innerHTML = '';
                    data.items.forEach(item => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${item.ans_id}</td>
                            <td>${item.title}</td>
                            <td>${item.category}</td>
                            <td>${item.synced ? '<span class="badge synced">已同步</span>' : '<span class="badge pending">待同步</span>'}</td>
                            <td>-</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function loadTasks() {
            try {
                const res = await fetch(`${API_BASE}/tasks`);
                const data = await res.json();
                if (data.status === 'success') {
                    const tbody = document.getElementById('taskTableBody');
                    tbody.innerHTML = '';
                    data.tasks.forEach(t => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${t.task_id || t.id}</td>
                            <td>${t.ans_id}</td>
                            <td>${t.title}</td>
                            <td>${t.category}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function loadLogs() {
            try {
                const res = await fetch(`${API_BASE}/logs`);
                const data = await res.json();
                if (data.status === 'success') {
                    const logBox = document.getElementById('logBox');
                    logBox.innerHTML = data.logs.map(l => `[${l.time}] ${l.endpoint} -> ${JSON.stringify(l.data)}`).join('\n');
                }
            } catch (e) {
                console.error(e);
            }
        }

        window.onload = () => {
            loadStatus();
            loadTasks();
            loadLogs();
            setInterval(() => {
                loadStatus();
                loadTasks();
                loadLogs();
            }, 5000);
        };
    </script>
</body>
</html>
