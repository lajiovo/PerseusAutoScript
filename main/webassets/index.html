<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统服务导航门户</title>
    <link rel="icon" href="/main/favicon1-128.ico" type="image/x-icon">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300 relative overflow-x-hidden">

    <!-- Background Gradient Blobs -->
    <div class="bg-blob w-96 h-96 rounded-full bg-indigo-400 dark:bg-indigo-900 top-[-100px] left-[-100px]"></div>
    <div class="bg-blob w-96 h-96 rounded-full bg-cyan-400 dark:bg-cyan-900 bottom-[-100px] right-[-100px]"></div>
    <div class="bg-blob w-80 h-80 rounded-full bg-purple-400 dark:bg-purple-950 top-[40%] left-[50%] -translate-x-1/2"></div>

    <!-- Navigation Header Bar -->
    <header class="w-full sticky top-0 z-50 glass-panel border-b border-slate-200/50 dark:border-slate-800/50 px-4 lg:px-8 py-2.5 transition-colors">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <!-- Brand Logo / Title -->
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center text-white shadow-md shadow-indigo-500/20">
                    <i class="fa-solid fa-compass text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base leading-tight tracking-tight bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-500 bg-clip-text text-transparent">控制中心门户</h1>
                    <p class="text-[10px] text-slate-500 dark:text-slate-400">Personal Navigation Hub</p>
                </div>
            </div>

            <!-- Header Controls -->
            <div class="flex items-center gap-2 sm:gap-3">
                <!-- Live Clock Widget -->
                <div id="liveClock" class="hidden md:flex items-center gap-1.5 text-xs font-semibold px-2.5 py-1 rounded-lg bg-slate-200/50 dark:bg-slate-800/50 text-slate-600 dark:text-slate-300">
                    <i class="fa-regular fa-clock text-indigo-500 text-xs"></i>
                    <span id="clockText">00:00:00</span>
                </div>

                <!-- New Tab Toggle Switcher (Optional Button) -->
                <button id="targetToggleBtn" onclick="toggleNewTabMode()" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium bg-slate-200/60 dark:bg-slate-800/60 hover:bg-slate-300/60 dark:hover:bg-slate-700/60 text-slate-700 dark:text-slate-300 transition-all border border-slate-300/50 dark:border-slate-700/50" title="点击切换是否在新标签页中打开链接">
                    <i id="targetToggleIcon" class="fa-solid fa-arrow-right-to-bracket text-slate-400"></i>
                    <span id="targetToggleText">当前页打开</span>
                </button>

                <!-- Dark Mode Switcher -->
                <button id="themeToggle" class="p-1.5 rounded-lg bg-slate-200/60 dark:bg-slate-800/60 hover:bg-slate-300/60 dark:hover:bg-slate-700/60 text-slate-700 dark:text-slate-200 transition-all focus:outline-none" title="切换夜间/日间模式">
                    <i id="themeIcon" class="fa-solid fa-moon text-sm"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 lg:px-8 py-6 space-y-6">

        <!-- Category Tabs (Dynamically Loaded from index.json) -->
        <div class="flex justify-center border-b border-slate-200 dark:border-slate-800 pb-2">
            <nav id="categoryNav" class="flex space-x-4" aria-label="Tabs">
                <button class="tab-btn active text-indigo-600 dark:text-indigo-400 font-semibold border-b-2 border-indigo-600 dark:border-indigo-400 pb-2 text-xs sm:text-sm px-2" data-target="all">全部区域</button>
            </nav>
        </div>

        <!-- Dynamic Sections Container -->
        <div id="dynamicSectionsContainer" class="space-y-6">
            <div class="flex justify-center items-center py-20">
                <div class="flex items-center gap-2 text-slate-400 text-sm">
                    <i class="fa-solid fa-circle-notch fa-spin text-indigo-500"></i> 正在加载导航配置...
                </div>
            </div>
        </div>

        <!-- Notification Toast Container -->
        <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 text-white dark:bg-slate-100 dark:text-slate-900 px-3.5 py-2 rounded-xl shadow-2xl flex items-center gap-2 text-xs font-medium pointer-events-none">
            <i class="fa-solid fa-circle-check text-emerald-400 dark:text-emerald-600"></i>
            <span id="toastMsg">信息提示</span>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full mt-auto border-t border-slate-200/50 dark:border-slate-800/50 py-4 text-center text-xs text-slate-400">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
            <p>© 2026 Homelab Navigation Hub. All rights reserved.</p>
            <div class="flex items-center gap-4 text-[11px] text-slate-400">
                <span class="inline-flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> 系统运行正常
                </span>
                <span>主机目标: 192.168.10.4</span>
            </div>
        </div>
    </footer>

    <!-- Include status.js for status tab functionality -->
    <script src="status.js"></script>
    <!-- Include index.js for main page logic -->
    <script src="index.js"></script>

    <!-- 1. 创建一个固定在屏幕右下角的容器 -->
    <div id="sakana-widget" style="
    position: fixed; 
    bottom: 20px; 
    right: 20px; 
    z-index: 9999;
    "></div>

    <div id="sakana-widget"></div>

    <!-- 1. 引入 4.0.0 的 UMD 脚本 -->
    <script
      async
      onload="initSakanaWidget()"
      src="https://cdn.jsdelivr.net/npm/sakana-widget@4.0.0/lib/index.umd.min.js"
    ></script>
    
    <style>
        #sakana-widget .sakana-widget-rod {
            width: 4px !important; /* 调整这里的数值来改变粗细 */
            background-color: rgba(0, 0, 0, 0.2) !important; 
        }
      </style>
    
    <script>
      function initSakanaWidget() {
        // 获取内置的千束角色数据作为模板
        const myCharacter = SakanaWidget.getcenter ? SakanaWidget.getCharacter('chisato') : SakanaWidget.getCharacter('chisato');
        
        // 如果获取到了，修改它的图片链接
        if (myCharacter) {
          myCharacter.image = '/main/sakana.png'; // 换成你的透明 PNG 图片链接
        }
    
        // 注册一个名为 'my-char' 的新角色
        SakanaWidget.registerCharacter('my-char', myCharacter);
    
        // 实例化并挂载，指定默认显示这个新角色
        new SakanaWidget({
          character: 'my-char',
          imageFit: 'contain', // 如果图片不是标准正方形，建议加上这句让图片完整显示
        }).mount('#sakana-widget');
      }
    </script>
</body>
</html>
