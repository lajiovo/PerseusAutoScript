<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代码状态与统计 - CodeStatus</title>
    <!-- 引入 Apache ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="codestatus.css">
</head>
<body>
    <div class="ambient-glow"></div>
    <div class="container">
        <!-- 现代炫酷 Header -->
        <header class="header">
            <div class="header-content">
                <div class="title-wrapper">
                    <div class="logo-icon">⚡</div>
                    <h1>代码仓库状态与统计</h1>
                </div>
                <div id="target-dir" class="target-dir-badge" title="目标文件夹">
                    <span class="pulse-dot"></span>
                    <span class="dir-text">载入中...</span>
                </div>
            </div>
        </header>

        <!-- 概览卡片区 (Bento Grid) -->
        <div class="stats-cards">
            <div class="card bento-card">
                <div class="card-icon files-icon">📂</div>
                <div class="card-info">
                    <h3>总文件数</h3>
                    <p id="stat-files" class="stat-value">-</p>
                </div>
                <div class="card-glow"></div>
            </div>
            <div class="card bento-card">
                <div class="card-icon lines-icon">📊</div>
                <div class="card-info">
                    <h3>总代码行数</h3>
                    <p id="stat-lines" class="stat-value">-</p>
                </div>
                <div class="card-glow"></div>
            </div>
            <div class="card bento-card">
                <div class="card-icon chars-icon">📝</div>
                <div class="card-info">
                    <h3>总字符数</h3>
                    <p id="stat-chars" class="stat-value">-</p>
                </div>
                <div class="card-glow"></div>
            </div>
        </div>

        <!-- ECharts 炫酷图表区 (位于指标卡下方、表格上方无缝嵌入) -->
        <div class="chart-section glass-panel">
            <div class="panel-header">
                <h2>📊 语言代码行数与分布图表</h2>
                <span class="badge-count" id="chart-badge">多维可视化</span>
            </div>
            <div id="echarts-container" class="echarts-container"></div>
        </div>

        <!-- 语言统计与文件列表区 -->
        <div class="content-grid">
            <!-- 语言统计面板 -->
            <div class="panel glass-panel">
                <div class="panel-header">
                    <h2>📈 各语言统计</h2>
                    <span class="badge-count" id="lang-count-badge">0 种语言</span>
                </div>
                <div class="table-container custom-scrollbar">
                    <table id="lang-table">
                        <thead>
                            <tr>
                                <th>语言</th>
                                <th>文件数</th>
                                <th>行数</th>
                                <th>字符数</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- 动态填充 -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 文件详情面板 -->
            <div class="panel glass-panel">
                <div class="panel-header">
                    <h2>📁 文件详情列表</h2>
                    <span class="badge-count" id="file-count-badge">0 个文件</span>
                </div>
                <div class="filter-controls">
                    <div class="search-box">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="search-input" placeholder="搜索文件名或路径...">
                    </div>
                    <div class="filter-box">
                        <select id="lang-filter">
                            <option value="">所有语言/类型</option>
                        </select>
                    </div>
                </div>
                <div class="table-container custom-scrollbar file-list-container">
                    <table id="file-table">
                        <thead>
                            <tr>
                                <th class="sortable" data-sort="path">文件路径 ↕</th>
                                <th class="sortable" data-sort="language">语言 ↕</th>
                                <th class="sortable" data-sort="lines">行数 ↕</th>
                                <th class="sortable" data-sort="chars">字符数 ↕</th>
                                <th class="sortable" data-sort="size">大小 ↕</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- 动态填充 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="codestatus.js"></script>
</body>
</html>
