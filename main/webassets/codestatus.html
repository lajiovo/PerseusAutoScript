<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代码状态与统计 - CodeStatus</title>
    <!-- 引入 Apache ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="codestatus.css">
</head>
<body>
    <div class="ambient-glow"></div>
    <div class="container">
        <!-- 现代炫酷 Header -->
        <header class="header">
            <div class="header-content">
                <div class="title-wrapper">
                    <div class="logo-icon">⚡</div>
                    <h1>代码仓库状态与统计</h1>
                </div>
                <div id="target-dir" class="target-dir-badge" title="目标文件夹">
                    <span class="pulse-dot"></span>
                    <span class="dir-text">载入中...</span>
                </div>
            </div>
        </header>

        <!-- 概览卡片区 (Bento Grid) -->
        <div class="stats-cards">
            <div class="card bento-card">
                <div class="card-icon files-icon">📂</div>
                <div class="card-info">
                    <h3>总文件数</h3>
                    <p id="stat-files" class="stat-value">-</p>
                </div>
                <div class="card-glow"></div>
            </div>
            <div class="card bento-card">
                <div class="card-icon lines-icon">📊</div>
                <div class="card-info">
                    <h3>总代码行数</h3>
                    <p id="stat-lines" class="stat-value">-</p>
                </div>
                <div class="card-glow"></div>
            </div>
            <div class="card bento-card">
                <div class="card-icon chars-icon">📝</div>
                <div class="card-info">
                    <h3>总字符数</h3>
                    <p id="stat-chars" class="stat-value">-</p>
                </div>
                <div class="card-glow"></div>
            </div>
        </div>

        <!-- 顶部额外增加指标卡：最大文件情况与平均文件情况 -->
        <div class="extra-metrics-grid">
            <div class="card bento-card metric-card">
                <div class="card-icon max-icon">👑</div>
                <div class="card-info">
                    <h3>最大文件情况</h3>
                    <p id="stat-max-file" class="stat-desc">-</p>
                    <div id="stat-max-meta" class="stat-subvalue">-</div>
                </div>
                <div class="card-glow"></div>
            </div>
            <div class="card bento-card metric-card">
                <div class="card-icon avg-icon">📈</div>
                <div class="card-info">
                    <h3>平均文件情况</h3>
                    <div class="avg-stats-row">
                        <span>平均行数: <strong id="stat-avg-lines">-</strong></span>
                        <span>平均字符: <strong id="stat-avg-chars">-</strong></span>
                    </div>
                </div>
                <div class="card-glow"></div>
            </div>
        </div>

        <!-- ECharts 炫酷图表区 1: 语言分布图 -->
        <div class="chart-section glass-panel" id="section-lang-chart">
            <div class="panel-header">
                <h2>📊 语言代码行数与分布图表</h2>
                <span class="badge-count" id="chart-badge">多维可视化</span>
            </div>
            <div id="echarts-container" class="echarts-container"></div>
        </div>

        <!-- ECharts 炫酷图表区 2: 文件 Top 柱状图（行数与字符数双 Y 轴对等规模/多系列对比展示） -->
        <div class="chart-section glass-panel" id="section-top-chart">
            <div class="panel-header">
                <h2>🚀 单文件规模 Top 柱状图 (行数与字符数双 Y 轴对比)</h2>
                <span class="badge-count" id="top-chart-badge">Top 15 文件</span>
            </div>
            <div id="echarts-top-container" class="echarts-container"></div>
        </div>

        <!-- 语言统计与文件列表区 -->
        <div class="content-grid">
            <!-- 语言统计面板 -->
            <div class="panel glass-panel">
                <div class="panel-header">
                    <h2>📈 各语言统计</h2>
                    <span class="badge-count" id="lang-count-badge">0 种语言</span>
                </div>
                <div class="table-container custom-scrollbar">
                    <table id="lang-table">
                        <thead>
                            <tr>
                                <th>语言</th>
                                <th>文件数</th>
                                <th>行数</th>
                                <th>字符数</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- 动态填充 -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 文件详情面板 -->
            <div class="panel glass-panel">
                <div class="panel-header">
                    <h2>📁 文件详情列表</h2>
                    <span class="badge-count" id="file-count-badge">0 个文件</span>
                </div>
                <div class="filter-controls">
                    <div class="search-box">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="search-input" placeholder="搜索文件名...">
                    </div>
                    <div class="filter-box">
                        <select id="lang-filter">
                            <option value="">所有语言/类型</option>
                        </select>
                    </div>
                </div>
                <div class="table-container custom-scrollbar file-list-container">
                    <table id="file-table">
                        <thead>
                            <tr>
                                <th class="sortable" data-sort="name">文件名 ↕</th>
                                <th class="sortable" data-sort="language">语言 ↕</th>
                                <th class="sortable" data-sort="lines">行数 ↕</th>
                                <th class="sortable" data-sort="chars">字符数 ↕</th>
                                <th class="sortable" data-sort="size">大小 ↕</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- 动态填充 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 留出底部控制面板高度的占位符，防止内容被遮挡 -->
        <div class="footer-spacer"></div>
    </div>

    <!-- 图表显示控制面板：固定在页面最底部 (Footer 区域)，提供美观的开关复选框 -->
    <footer class="footer-control-panel">
        <div class="footer-panel-content">
            <div class="footer-brand">
                <span>🎛️ 图表显示控制</span>
            </div>
            <div class="checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="toggle-lang-chart" checked>
                    <span>语言代码行数与分布图</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="toggle-top-chart" checked>
                    <span>单文件规模 Top 双轴柱状图</span>
                </label>
            </div>
        </div>
    </footer>

    <script src="codestatus.js"></script>
</body>
</html>
