<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PerseusFocus - 核心学习多天/多周/多科综合看板</title>
    <link rel="icon" href="/main/favicon4-128.ico" type="image/x-icon">
    <!-- 引入 Chart.js 用于炫酷图表展示 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="./watch.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-title-row">
                <h1>PerseusFocus 学习核心全景看板</h1>
                <span class="badge">RedmiWatch6 顶配版</span>
            </div>
            <p class="subtitle">多天、多周、多科综合视图与加权投入深度图表分析</p>
        </header>

        <div class="stats-overview">
            <div class="card">
                <h3>总学习时长</h3>
                <p id="totalDuration" class="number highlight-blue">0 小时</p>
            </div>
            <div class="card">
                <h3>同步记录数</h3>
                <p id="totalRecords" class="number highlight-purple">0 条</p>
            </div>
            <div class="card">
                <h3>总加权得分</h3>
                <p id="totalWeighted" class="number highlight-green">0.0</p>
            </div>
        </div>

        <!-- 炫酷图表展示区 -->
        <div class="charts-grid">
            <div class="chart-card">
                <h3>📈 多天学习趋势分析 (分钟)</h3>
                <div class="canvas-container">
                    <canvas id="dailyTrendChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <h3>📊 多科目投入占比与加权柱状图</h3>
                <div class="canvas-container">
                    <canvas id="subjectChart"></canvas>
                </div>
            </div>
        </div>

        <div class="main-content">
            <section class="section">
                <h2>科目投入权重与加权得分分析</h2>
                <div class="table-container">
                    <table id="subjectTable">
                        <thead>
                            <tr>
                                <th>科目名称</th>
                                <th>学习时长 (分钟)</th>
                                <th>投入权重</th>
                                <th>加权得分</th>
                                <th>打卡次数</th>
                            </tr>
                        </thead>
                        <tbody id="subjectTableBody">
                            <tr><td colspan="5" class="loading">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <section class="section">
                <h2>科目权重科学规划配置</h2>
                <form id="weightForm" class="weight-form">
                    <div id="weightInputsContainer" class="weight-inputs-grid">
                        <!-- 动态填充 -->
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn primary">保存权重配置</button>
                        <button type="button" id="clearBtn" class="btn danger">清空所有学习记录</button>
                    </div>
                </form>
            </section>

            <section class="section">
                <h2>最近自动去重同步学习记录</h2>
                <div class="table-container">
                    <table id="recordTable">
                        <thead>
                            <tr>
                                <th>时间</th>
                                <th>科目</th>
                                <th>时长 (分钟)</th>
                                <th>备注说明</th>
                            </tr>
                        </thead>
                        <tbody id="recordTableBody">
                            <tr><td colspan="4" class="loading">暂无记录</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>

    <script src="./watch.js"></script>
</body>
</html>
