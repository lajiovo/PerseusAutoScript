<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PerseusLogViewer - 系统日志实时监控与查看中心</title>
    <link rel="icon" href="/main/favicon4-128.ico" type="image/x-icon">
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --text-muted: #8b949e;
            --accent-color: #58a6ff;
            --accent-hover: #1f6feb;
            --danger-color: #f85149;
            --success-color: #2ea043;
            --warning-color: #d29922;
            --code-bg: #010409;
        }

        .light-theme {
            --bg-color: #f6f8fa;
            --panel-bg: #ffffff;
            --border-color: #d0d7de;
            --text-color: #24292f;
            --text-muted: #57606a;
            --accent-color: #0969da;
            --accent-hover: #1f6feb;
            --danger-color: #cf222e;
            --success-color: #1a7f37;
            --warning-color: #9a6700;
            --code-bg: #f6f8fa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.2s, color 0.2s;
        }

        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-title h1 {
            font-size: 1.2rem;
        }

        .badge {
            background-color: rgba(56, 139, 253, 0.15);
            color: var(--accent-color);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* 要求的 category-bar 分类栏 */
        .category-bar {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 8px 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .cat-btn {
            background-color: var(--code-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.15s;
        }

        .cat-btn:hover {
            border-color: var(--accent-color);
        }

        .cat-btn.active {
            background-color: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
            font-weight: 600;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        aside {
            width: 320px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        select, input, button {
            background-color: var(--code-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input:focus {
            border-color: var(--accent-color);
        }

        .file-list {
            flex: 1;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--code-bg);
        }

        .file-item {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: background-color 0.15s;
        }

        .file-item:hover {
            background-color: rgba(255, 255, 255, 0.03);
        }

        .file-item.active {
            background-color: rgba(56, 139, 253, 0.15);
            border-left: 3px solid var(--accent-color);
        }

        .file-name {
            font-weight: 600;
            font-size: 0.9rem;
            word-break: break-all;
        }

        .file-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        /* 特殊子分类徽章（Azurpilot launcher/gui/alas等） */
        .sub-badge {
            font-size: 0.65rem;
            padding: 1px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
        .badge-launcher { background-color: rgba(210, 153, 34, 0.2); color: var(--warning-color); }
        .badge-gui { background-color: rgba(88, 166, 255, 0.2); color: var(--accent-color); }
        .badge-alas { background-color: rgba(46, 160, 67, 0.2); color: var(--success-color); }
        .badge-sub { background-color: rgba(139, 148, 158, 0.2); color: var(--text-muted); }

        content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
            overflow: hidden;
        }

        .toolbar {
            padding: 10px 20px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .toolbar-left, .toolbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            background-color: var(--code-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background-color 0.15s;
        }

        .btn:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .btn.primary {
            background-color: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
            font-weight: 600;
        }

        .btn.primary:hover {
            opacity: 0.9;
        }

        .toggle-switch {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            user-select: none;
        }

        .log-viewer-container {
            flex: 1;
            overflow: auto;
            padding: 16px;
            position: relative;
        }

        pre {
            background-color: var(--code-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 16px;
            color: var(--text-color);
            font-family: Fira Code, Consolas, Monaco, monospace;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-all;
            min-height: 100%;
        }

        /* 字体大小设定 */
        pre.font-small { font-size: 0.75rem; }
        pre.font-medium { font-size: 0.85rem; }
        pre.font-large { font-size: 1.0rem; }
        pre.font-xlarge { font-size: 1.2rem; }

        /* 级别染色样式 */
        .log-error { color: var(--danger-color); font-weight: bold; }
        .log-warn { color: var(--warning-color); font-weight: bold; }
        .log-info { color: var(--success-color); }
        .log-debug { color: var(--text-muted); }

        .status-bar {
            background-color: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            padding: 6px 20px;
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        /* 手机端响应式适配媒体查询 (Media Queries) */
        @media screen and (max-width: 768px) {
            body {
                height: 100vh;
                overflow: auto;
            }

            header {
                padding: 8px 12px;
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            header > div:last-child {
                width: 100%;
                justify-content: space-between;
            }

            .category-bar {
                padding: 6px 12px;
                gap: 6px;
                overflow-x: auto;
                white-space: nowrap;
                flex-wrap: nowrap;
                -webkit-overflow-scrolling: touch;
            }

            .cat-btn {
                padding: 3px 8px;
                font-size: 0.75rem;
                flex-shrink: 0;
            }

            .main-container {
                flex-direction: column;
                height: auto;
                overflow: visible;
                flex: none;
            }

            aside {
                width: 100% !important;
                max-height: 280px;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                padding: 12px;
            }

            .file-list {
                max-height: 140px;
            }

            content-area {
                width: 100% !important;
                height: 60vh;
                min-height: 400px;
                display: flex;
                flex-direction: column;
            }

            .toolbar {
                padding: 8px 12px;
                gap: 8px;
            }

            .toolbar-left, .toolbar-right {
                gap: 6px;
                width: 100%;
                justify-content: space-between;
            }

            .log-viewer-container {
                padding: 8px;
                -webkit-overflow-scrolling: touch;
            }

            pre {
                padding: 10px;
                font-size: 0.75rem;
                white-space: pre-wrap;
                word-break: break-all;
            }
        }

        /* 横屏模式 (Landscape) 针对小屏手机的特殊优化 */
        @media screen and (max-height: 500px) and (orientation: landscape) {
            body {
                height: 100vh;
                overflow: auto;
            }

            header {
                padding: 4px 12px;
            }

            header h1 {
                font-size: 1rem;
            }

            .category-bar {
                padding: 4px 12px;
            }

            .main-container {
                flex-direction: row;
                height: calc(100vh - 85px);
            }

            aside {
                width: 280px !important;
                max-height: none;
                height: 100%;
                border-right: 1px solid var(--border-color);
                border-bottom: none;
            }

            .file-list {
                flex: 1;
                max-height: none;
            }

            content-area {
                height: 100%;
            }

            .log-viewer-container {
                height: calc(100vh - 160px);
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <a href="/main/index.html" class="btn" style="text-decoration: none; padding: 4px 10px;">🏠 返回主页</a>
            <h1>PerseusLogViewer</h1>
            <span class="badge" id="currentFolderTag">系统日志实时监控</span>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end;">
            <span id="currentFilePath" style="font-size: 0.85rem; color: var(--text-muted); max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">请选择文件夹与日志文件</span>
            <button class="btn" id="themeToggleBtn" title="切换夜间/日间模式">🌙 模式</button>
        </div>
    </header>

    <!-- 要求的 category-bar 分类栏 -->
    <div class="category-bar" id="categoryBar">
        <span style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">快捷分类：</span>
        <button class="cat-btn active" data-category="all">全部文件夹</button>
        <button class="cat-btn" data-category="yunzai">云崽日志 (Yunzai)</button>
        <button class="cat-btn" data-category="perseus_logs">主服务日志 (Perseus)</button>
        <button class="cat-btn" data-category="azurpilot">AzurPilot 日志</button>
        <button class="cat-btn" data-category="qbot_log">机器人日志 (QBOTLOG)</button>
        <button class="cat-btn" data-category="qbot_sdk">QBotSDK日志 (QBOTSDKLOG)</button>
    </div>

    <div class="main-container">
        <!-- 侧边栏：文件夹与文件选择 -->
        <aside>
            <div class="control-group">
                <label for="folderSelect">选择日志文件夹</label>
                <select id="folderSelect">
                    <option value="">加载中...</option>
                </select>
            </div>

            <div class="control-group">
                <label for="searchInput">过滤日志文件</label>
                <input type="text" id="searchInput" placeholder="输入关键字过滤文件...">
            </div>

            <div class="control-group" style="flex: 1; display: flex; flex-direction: column;">
                <label>日志文件列表 (已过滤 .json)</label>
                <div class="file-list" id="fileList">
                    <div style="padding: 16px; text-align: center; color: var(--text-muted); font-size: 0.85rem;">
                        请先选择上方文件夹
                    </div>
                </div>
            </div>
        </aside>

        <!-- 主内容区：日志内容与工具栏 -->
        <content-area style="flex: 1; display: flex; flex-direction: column;">
            <div class="toolbar">
                <div class="toolbar-left">
                    <button class="btn" id="refreshBtn">🔄 手动刷新</button>
                    <label class="toggle-switch">
                        <input type="checkbox" id="autoRefreshToggle" checked> 自动刷新 (3s)
                    </label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="autoScrollToggle" checked> 自动滚动到底部
                    </label>
                </div>
                <div class="toolbar-right">
                    <!-- 要求 3: 可选字体大小 -->
                    <label for="fontSizeSelect">字体：</label>
                    <select id="fontSizeSelect" style="padding: 4px 8px;">
                        <option value="small">小</option>
                        <option value="medium" selected>中</option>
                        <option value="large">大</option>
                        <option value="xlarge">特大</option>
                    </select>
                    <label class="toggle-switch" title="是否保留行首的标准时间戳">
                        <input type="checkbox" id="timestampToggle" checked> 保留时间戳
                    </label>
                    <!-- 新增：过滤 HTTP 访问/静态请求日志开关（默认勾选） -->
                    <label class="toggle-switch" title="过滤掉类似 GET /... HTTP/1.1, 304 -, 静态文件访问等噪音日志">
                        <input type="checkbox" id="filterHttpToggle" checked> 过滤HTTP/静态请求
                    </label>
                    <!-- 要求 4: 默认关闭日志染色 -->
                    <label class="toggle-switch" title="高亮显示 ERROR / WARNING / INFO">
                        <input type="checkbox" id="highlightToggle"> 日志染色
                    </label>
                    <label for="linesSelect">行数：</label>
                    <select id="linesSelect" style="padding: 4px 8px;">
                        <option value="50">50行</option>
                        <option value="100" selected>100行</option>
                        <option value="300">300行</option>
                        <option value="1000">1000行</option>
                        <option value="0">全部</option>
                    </select>
                    <button class="btn" id="scrollTopBtn">⬆ 顶部</button>
                    <button class="btn" id="scrollBottomBtn">⬇ 底部</button>
                </div>
            </div>

            <div class="log-viewer-container" id="logContainer">
                <pre id="logContent" class="font-medium">请在左侧选择需要查看的日志文件...</pre>
            </div>

            <div class="status-bar">
                <span id="fileStatusInfo">就绪</span>
                <span id="updateTimeInfo">最后更新：-</span>
            </div>
        </content-area>
    </div>

    <!-- 要求 1: 独立引入 log.js -->
    <script src="/main/log.js"></script>
</body>
</html>
