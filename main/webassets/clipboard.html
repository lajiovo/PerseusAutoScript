<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>云端剪切板 - Perseus</title>
  <link rel="stylesheet" href="dash.css">
  <link rel="stylesheet" href="clipboard.css">
</head>
<body>

<div class="container">
  <header>
    <h1>📋 云端剪切板 & 文件中心</h1>
    <div style="display: flex; gap: 10px;">
        <button class="btn-warning" style="flex: none; min-width: auto; padding: 6px 14px;" onclick="fetchData()">🔄 刷新</button>
        <button class="btn-primary" style="flex: none; min-width: auto; padding: 6px 14px;" onclick="location.href='/main/index.html'">🏠 菜单</button>
    </div>
  </header>

  <div class="clipboard-grid">
    <!-- 第一列：文本内容与历史 -->
    <div class="col">
      <div class="card">
        <div class="card-header">
          <div class="card-title">文本内容</div>
          <div class="card-actions">
            <button class="btn-mini btn-danger" onclick="clearText()">清空</button>
          </div>
        </div>
        <textarea id="textClipboard" placeholder="在此输入内容或直接粘贴(Ctrl+V)..."></textarea>
        <div class="btn-group">
          <button class="btn-success" onclick="saveText()">💾 保存</button>
          <button class="btn-accent" onclick="copyText()">📄 复制</button>
          <button class="btn-primary" onclick="pasteFromClipboard()">📥 粘贴上传</button>
        </div>
      </div>

      <div class="card history-card">
        <div class="card-header">
          <div class="card-title">历史记录</div>
          <div class="card-actions">
            <button class="btn-mini btn-danger" onclick="clearHistory()">清空历史</button>
          </div>
        </div>
        <div id="textHistory" class="history-list">
          <div class="loading">加载中...</div>
        </div>
      </div>
    </div>

    <!-- 第二列：图片画廊与文件中心 -->
    <div class="col">
      <div class="card">
        <div class="card-title">上传与同步 (支持拖拽/粘贴)</div>
        <div class="upload-area" id="uploadArea">
          <p>点击/拖拽/Ctrl+V 粘贴图片或文件</p>
          <input type="file" id="fileInput" multiple style="display: none;">
        </div>
        <div id="uploadStatus" class="status-text"></div>
      </div>

      <div class="card gallery-card">
        <div class="card-title">图片画廊</div>
        <div id="imageGallery" class="image-grid">
          <div class="loading">加载中...</div>
        </div>
      </div>

      <div class="card files-card">
        <div class="card-title">文件中心</div>
        <div id="fileList" class="file-list">
          <div class="loading">加载中...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 吐司提示 -->
  <div id="toast" class="toast"></div>
</div>

<script src="clipboard.js"></script>
</body>
</html>
